name: koofy_reader_bridge
description: Native Readium reading screens for Koofy Reader.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.koofy.reader.bridge
        pluginClass: KoofyReaderBridgePlugin
      ios:
        pluginClass: KoofyReaderBridgePlugin
